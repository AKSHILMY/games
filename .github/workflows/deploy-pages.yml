name: Deploy games to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: racecar/package-lock.json

      - name: Test and build racecar
        working-directory: racecar
        run: |
          npm ci
          npm test
          npm run build
        env:
          VITE_TURN_URL: ${{ secrets.TURN_URL }}
          VITE_TURN_USER: ${{ secrets.TURN_USER }}
          VITE_TURN_PASS: ${{ secrets.TURN_PASS }}

      - name: Assemble site
        run: |
          mkdir -p _site/racecar
          cp -r racecar/dist/. _site/racecar/
          cp index.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
